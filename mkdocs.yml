site_name: pydbzengine
site_description: Pythonic interface for the Debezium Embedded Engine
site_url: https://memiiso.github.io/pydbzengine
repo_url: https://github.com/memiiso/pydbzengine
repo_name: memiiso/pydbzengine
edit_uri: edit/main/docs/
copyright: >
  Licensed under the Apache License 2.0 &mdash; Powered by
  <a href="https://debezium.io" target="_blank" rel="noopener">Debezium</a>

theme:
  name: material
  logo: assets/debezium-icon.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/debezium.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - How it Works: how-it-works.md
      - Configuration: configuration.md
  - Schema Subsystem:
      - Architecture & Pipeline: schema/index.md
      - Domain Models & Types: schema/models.md
      - Schema-Aware Consumer: schema/consumer.md
  - Handlers:
      - Overview: handlers/index.md
      - Apache Iceberg: handlers/iceberg.md
      - dlt (data load tool): handlers/dlt.md
      - Custom Handlers: handlers/custom.md
  - Integrations & Utilities:
      - Apache Airflow: airflow.md
      - Helper Utilities: helpers.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - abbr
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/memiiso/pydbzengine
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pydbzengine
    - icon: material/database-sync
      link: https://debezium.io
      name: Debezium Official Site

