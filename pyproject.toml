[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

# Packaging: ship only pydbzengine (exclude tests/docs), bundle runtime JARs & py.typed
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pydbzengine*"]
exclude = ["tests*", "scripts*", "docs*", "site*", "pydbzengine.examples*"]

[tool.setuptools.package-data]
"pydbzengine" = ["debezium/libs/*.jar", "config/*", "py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["*.md", "**/*.md"]

[project]
name = "pydbzengine"
dynamic = ["version"]
authors = [
    { name = "Memiiso Organization" },
]
description = "Python Debezium Embedded Engine"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Debezium", "Replication", "CDC"]
license = { text = "Apache License 2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jpype1>=1.6.0",
]

[project.optional-dependencies]
arrow = [
    "pyarrow",
]
iceberg = [
    "pyiceberg[pyiceberg-core]>=0.10.0",
    "pyarrow",
]
dlt = [
    "dlt>=1.5.0",
]
airflow = [
    "apache-airflow>=2.10.4",
]
dev = [
    "testcontainers[minio]>=4.13.3",
    "dlt[duckdb]>=1.5.0",
    "apache-airflow>=2.10.4",
    "psycopg2-binary",
    "pandas",
    "pytest",
    "sqlalchemy",
    "ruff",
    "mypy",
    "coverage",
]
docs = [
    "mkdocs-material",
]

#[project.scripts]
#debezium = "pydbzengine.__main__:main"

[project.urls]
Homepage = "https://github.com/memiiso/pydbzengine"
Documentation = "https://github.com/memiiso/pydbzengine"
Repository = "https://github.com/memiiso/pydbzengine"
Issues = "https://github.com/memiiso/pydbzengine/issues"
Changelog = "https://github.com/memiiso/pydbzengine/releases"

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["pydbzengine"]
omit = ["tests/*", "pydbzengine/examples/*"]

