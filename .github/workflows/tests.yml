name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '.idea/**'
      - '.run/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.idea/**'
      - '.run/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        java-version: [ "17", "21" ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python3 --version
          pip install --upgrade pip setuptools
          python3 -m compileall -f pydbzengine
          pip install .[dev,dlt,iceberg]

      - name: Lint and Type Check
        run: |
          ruff check .
          ruff format --check .
          mypy pydbzengine

      - name: Run Unit Tests
        run: |
          python3 -m coverage run --source=pydbzengine -m unittest discover -s tests/unit

      - name: Run Integration Tests
        run: |
          python3 -m coverage run --append --source=pydbzengine -m unittest discover -s tests/integration

      - name: Coverage Report
        run: |
          python3 -m coverage report -m

